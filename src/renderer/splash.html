<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>PelakaVoice</title>
  <style>
    :root { --bg: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --track: #e2e2e8; --a1: #2b8cff; --a2: #0071e3; --a3: #0071e3; --glow: rgba(0, 113, 227, 0.3); }
    [data-theme="midnight"] { --bg: #000; --fg: #f5f5f7; --muted: #a1a1a6; --track: #2a2a2d; --a1: #47a6ff; --a2: #2997ff; --a3: #2997ff; --glow: rgba(41, 151, 255, 0.35); }
    [data-theme="aurora"] { --bg: #0d0b1a; --fg: #ece9ff; --muted: #a9a3cf; --track: #262048; --a1: #a78bfa; --a2: #7c3aed; --a3: #7c3aed; --glow: rgba(139, 92, 246, 0.4); }
    [data-theme="nova"] { --bg: #07070d; --fg: #f4f4ff; --muted: #a8a8c8; --track: #1d1d30; --a1: #7c5cff; --a2: #22d3ee; --a3: #f472b6; --glow: rgba(124, 92, 255, 0.6); }
    * { margin: 0; box-sizing: border-box; user-select: none; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--fg); -webkit-app-region: drag; overflow: hidden;
      font-family: -apple-system, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; overflow: hidden;
    }
    .blob { position: fixed; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, var(--glow), transparent 65%); top: -120px; left: -80px; animation: drift 5s ease-in-out infinite alternate; pointer-events: none; }
    .blob.b2 { top: auto; left: auto; bottom: -160px; right: -120px; background: radial-gradient(circle, color-mix(in srgb, var(--a2) 35%, transparent), transparent 65%); animation-duration: 6s; }
    @keyframes drift { to { transform: translate(60px, 40px) scale(1.15); } }
    .mark { position: relative; animation: enter 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .ring { position: absolute; inset: -16px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--a2); border-right-color: var(--a1); animation: spin 1.6s linear infinite; }
    .ring.r2 { inset: -30px; border-top-color: transparent; border-bottom-color: var(--a3); border-left-color: color-mix(in srgb, var(--a3) 40%, transparent); animation-duration: 2.6s; animation-direction: reverse; opacity: 0.8; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes enter { from { opacity: 0; transform: scale(0.6) rotate(-12deg); } }
    .logo {
      position: relative; width: 84px; height: 84px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 5px;
      background: linear-gradient(135deg, var(--a1), var(--a2) 60%, var(--a3)); background-size: 220% 220%;
      box-shadow: 0 0 60px var(--glow); animation: breathe 2.4s ease-in-out infinite, shift 4s ease-in-out infinite;
    }
    @keyframes shift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    h1 { animation: enter 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both; }
    .logo i { width: 5px; border-radius: 3px; background: #fff; animation: bar 1.1s ease-in-out infinite; }
    .logo i:nth-child(1) { height: 14px; animation-delay: 0s; }
    .logo i:nth-child(2) { height: 28px; animation-delay: 0.12s; }
    .logo i:nth-child(3) { height: 40px; animation-delay: 0.24s; }
    .logo i:nth-child(4) { height: 28px; animation-delay: 0.36s; }
    .logo i:nth-child(5) { height: 14px; animation-delay: 0.48s; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
    #status { font-size: 12.5px; color: var(--muted); height: 16px; }
    .track { width: 170px; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
    #bar { height: 100%; width: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--a1), var(--a2)); transform-origin: left; transform: scaleX(0.3); animation: slide 1.2s ease-in-out infinite; }
    #bar.fixed { animation: none; transition: transform 0.25s ease-out; }
    small { position: fixed; bottom: 12px; font-size: 10.5px; color: var(--muted); opacity: 0.7; }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes bar { 0%, 100% { transform: scaleY(0.55); } 50% { transform: scaleY(1); } }
    @keyframes slide { 0% { transform: translateX(-60%) scaleX(0.3); } 100% { transform: translateX(120%) scaleX(0.3); } }
  </style>
</head>
<body>
  <div class="blob"></div><div class="blob b2"></div>
  <div class="mark"><span class="ring"></span><span class="ring r2"></span><div class="logo"><i></i><i></i><i></i><i></i><i></i></div></div>
  <h1>PelakaVoice</h1>
  <div id="status">Starting…</div>
  <div class="track"><div id="bar"></div></div>
  <small id="version"></small>
  <script src="splash.js"></script>
</body>
</html>
